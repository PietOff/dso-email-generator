name: Sync Power BI Data

on:
  schedule:
    - cron: "0 8 * * *" # Runs at 08:00 AM UTC
  workflow_dispatch: # Manual trigger
  repository_dispatch: # API trigger from Vercel
    types: [sync-powerbi]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run Sync Script
        run: npm run sync
        continue-on-error: true
        env:
          CI: true

      - name: Print HTML to Logs for Extraction
        if: always()
        run: |
          for f in debug_*.html; do
            if [ -f "$f" ]; then
              echo "=== START_DOM_DUMP: $f ==="
              cat "$f"
              echo "=== END_DOM_DUMP: $f ==="
            fi
          done

      - name: Print Data to Logs for Extraction
        if: always()
        run: |
          for f in debug_before_*.png; do
            if [ -f "$f" ]; then
              echo "Uploading $f to 0x0.st..."
              URL=$(curl -s -F "file=@$f" https://0x0.st || echo "Failed")
              echo "URL_IMAGE_BEFORE: $URL"
            fi
          done
          for f in debug_after_*.png; do
            if [ -f "$f" ]; then
              echo "Uploading $f to 0x0.st..."
              URL=$(curl -s -F "file=@$f" https://0x0.st || echo "Failed")
              echo "URL_IMAGE_AFTER: $URL"
            fi
          done

      - name: Upload Debug Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-screenshots
          path: |
            debug_*.png
            debug_*.html
