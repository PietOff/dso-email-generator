name: Sync Power BI Data

on:
  schedule:
    - cron: "0 8 1,15 * *" # Runs at 08:00 AM UTC on the 1st and 15th of every month
  workflow_dispatch: # Manual trigger
  repository_dispatch: # API trigger from Vercel
    types: [sync-powerbi]

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Puppeteer system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk-bridge2.0-0 libx11-xcb1 libxcb-dri3-0 \
            libdrm2 libgbm1 libasound2t64 libxshmfence1 libxrandr2 \
            libpangocairo-1.0-0 libgtk-3-0 libxdamage1 libxcomposite1 \
            libatspi2.0-0 libcups2 fonts-liberation

      - name: Install dependencies
        run: npm install

      - name: Run Sync Script
        run: npm run sync
        timeout-minutes: 10
        env:
          CI: true
          PUPPETEER_ARGS: "--no-sandbox --disable-setuid-sandbox"
